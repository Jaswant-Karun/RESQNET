# yaml-language-server: $schema=./.vscode/compose-spec.json
services:
  resqnet-n8n:
    image: n8nio/n8n:latest
    container_name: resqnet-n8n
    restart: unless-stopped
    ports:
      - "5680:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5680/
      - N8N_DISABLE_PRODUCTION_MAIN_PROCESS=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - resqnet_n8n_data:/home/node/.n8n

volumes:
  resqnet_n8n_data:
    name: resqnet_n8n_data
